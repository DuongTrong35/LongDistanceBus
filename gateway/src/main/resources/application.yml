server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway   # <- expose endpoint gateway
  endpoint:
    gateway:
      enabled: true                    # <- bật riêng endpoint gateway
    health:
      show-details: when_authorized    # tùy chọn

spring:
  cloud:
    gateway:
      routes:
        - id: schedule-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/schedule/**
        - id: allroute-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/allroute/**
        - id: seat-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/seats/**
        - id: staff-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/employees/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/auth/**,/api/auth/**,/api/secure/**
        - id: booking
          uri: http://localhost:8081
          predicates:
            - Path=/api/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

