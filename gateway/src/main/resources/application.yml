server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: when_authorized

spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service-auth
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**
        - id: staff-service-seats
          uri: http://localhost:8084
          predicates:
            - Path=/api/seats/**
        - id: staff-service-employees
          uri: http://localhost:8083
          predicates:
            - Path=/api/employees/**
        - id: booking-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/booking/**,/api/trips/**
        - id: default-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
