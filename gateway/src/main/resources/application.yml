server:
  port: 8085

spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        # Giữ lại giá trị CORS đầu tiên, loại bỏ các bản trùng/đính kèm từ backend
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth
          uri: http://localhost:8081
          predicates: [ Path=/api/auth/** ]
          #filters: [ StripPrefix=1 ]
        - id: booking
          uri: http://localhost:8081
          predicates: [ Path=/api/booking/** ]
          #filters: [ StripPrefix=1 ]
