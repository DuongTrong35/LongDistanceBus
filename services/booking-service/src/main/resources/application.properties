spring.application.name=LongDistanceBus

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/longdistancebus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=change_this_to_a_very_long_random_string_256bit
app.jwt.access-ttl-minutes=15
# Cho phép ch?y schema.sql/data.sql c? khi dùng MySQL
spring.sql.init.mode=always
# ??m b?o ch?y data.sql SAU khi Hibernate t?o b?ng t? entity
spring.jpa.defer-datasource-initialization=true
