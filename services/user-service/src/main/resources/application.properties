spring.application.name=UserService
server.port=8082
# OAuth2 Resource Server sẽ được cấu hình thủ công trong SecurityConfig
# Không set jwk-set-uri ở đây để tránh auto-configuration
# MySQL (userdb ?ang TR?NG)
spring.datasource.url=jdbc:mysql://localhost:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.issuer=ldbus-user
jwt.access-token-ttl-minutes=30
jwt.refresh-token-ttl-days=7
# JWT RSA Keys - Generated for development
# Keys are stored without newlines (Spring properties format)
# You can override these with environment variables JWT_PRIVATE_PEM and JWT_PUBLIC_PEM
jwt.private-key-pem=${JWT_PRIVATE_PEM:-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----}
jwt.public-key-pem=${JWT_PUBLIC_PEM:-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----}

logging.level.org.springframework=INFO
logging.level.com.longdistancebus.user=DEBUG
logging.level.org.springframework.security=TRACE
