server.port=8082
spring.application.name=user-service

# === Datasource ===
spring.datasource.url=jdbc:mysql://localhost:3306/longdistancebus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA & Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# === Logging ===
logging.level.org.springframework.security=INFO
logging.level.com.longdistancebus=DEBUG

# === OTP/Twilio placeholders ===
#twilio.account-sid=YOUR_ACCOUNT_SID
#twilio.auth-token=YOUR_AUTH_TOKEN
#twilio.verify-service-sid=YOUR_VERIFY_SERVICE_SID
