spring:
  datasource:
    url: jdbc:mysql://localhost:3306/longdistancebus  # Đảm bảo kết nối đúng đến database longdistancebus
    username: root  # Tên người dùng MySQL
    password: 123456 # Mật khẩu của MySQL
    driver-class-name: com.mysql.cj.jdbc.Driver  # Driver JDBC cho MySQL

  jpa:
    hibernate:
      ddl-auto: update  # Hibernate sẽ tự động cập nhật schema nếu cần
    show-sql: true  # Hiển thị các câu lệnh SQL trong log (hữu ích để kiểm tra câu lệnh SQL)
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect  # Sử dụng MySQL8Dialect thay vì MySQL5Dialect

  flyway:
    enabled: false  # Nếu không sử dụng Flyway để migrate
